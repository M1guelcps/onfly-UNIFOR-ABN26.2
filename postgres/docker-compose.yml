services:
  postgres:
    # Usamos a versão Alpine (muito mais leve que a versão padrão)
    image: postgres:16-alpine
    container_name: central-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "ZX2y6DS2qwFvKx6984BwoiDCkUsgD3"
    volumes:
      # Os dados do banco ficarão salvos na pasta 'data' dentro de /opt/paas/postgres
      # Se o container for apagado, seus dados continuam seguros aqui!
      - ./data:/var/lib/postgresql/data
    networks:
      # O banco fica na mesma rede do Traefik e dos apps
      - proxy
    # NOTA: Não existe a tag 'ports' aqui! Acesso estritamente interno.
    deploy:
      resources:
        limits:
          cpus: '0.5'    # Pode usar até metade de 1 núcleo
          memory: 400M   # Limite generoso, mas controlado para proteger a VPS

networks:
  proxy:
    external: true