name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Roda o script sempre que enviar código para a main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Dá permissão para o robô salvar a imagem no GHCR

    steps:
      - name: 1. Baixar o código
        uses: actions/checkout@v4

      - name: 2. Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # O GitHub gera essa senha sozinho!

      - name: 3. Construir e Salvar a Imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # MUDE SEU_USUARIO PARA O SEU USUÁRIO EM MINÚSCULAS ABAIXO:
          tags: ghcr.io/m1guelcps/onfly-unifor-abn26.2:latest

      - name: 4. Atualizar aplicação na VPS
              uses: appleboy/ssh-action@v1.2.2
              with:
                host: ${{ secrets.VPS_HOST }}
                username: ${{ secrets.VPS_USERNAME }}
                key: ${{ secrets.VPS_SSH_KEY }}
                script: |
                  cd /opt/paas/apps/projeto-auto

                  echo "Baixando nova imagem..."
                  docker pull ghcr.io/m1guelcps/onfly-unifor-abn26.2:latest

                  echo "Recriando aplicação..."
                  docker compose up -d --force-recreate

                  echo "Limpando imagens antigas..."
                  docker image prune -f

                  echo "Deploy concluído!"