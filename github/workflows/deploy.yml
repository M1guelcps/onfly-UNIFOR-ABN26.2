name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Roda o script sempre que enviar código para a main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Dá permissão para o robô salvar a imagem no GHCR

    steps:
      - name: 1. Baixar o código
        uses: actions/checkout@v4

      - name: 2. Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # O GitHub gera essa senha sozinho!

      - name: 3. Construir e Salvar a Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # MUDE SEU_USUARIO PARA O SEU USUÁRIO EM MINÚSCULAS ABAIXO:
          tags: ghcr.io/SEU_USUARIO/projeto-auto:latest

      - name: 4. Acessar a VPS e Atualizar a Aplicação
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/paas/apps/projeto-auto
            # Usamos o token temporário do robô para a VPS conseguir baixar a imagem
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Baixamos a imagem nova e recriamos o container
            docker compose pull
            docker compose up -d